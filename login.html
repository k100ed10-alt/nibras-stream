<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول | نبراس ستريم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="oman-strip"></div>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html"><span class="logo-mark">ن</span> نبراس ستريم</a>
    </div>
  </header>
  <div class="auth-card">
    <div class="eyebrow">تجربة المنصة · بدون تسجيل حقيقي</div>
    <h1 style="font-size:28px;margin:12px 0">اختر صفة الدخول</h1>
    <p style="color:#64748b">الدخول التجريبي يحفظ الصف الثامن كافتراضي. تقدر تغيّر الصف من الصفحة الرئيسية.</p>
    <div class="role-pick">
      <button class="btn btn-teal" onclick="loginDemo('student')">دخول كطالب · أحمد الكندي</button>
      <button class="btn btn-primary" onclick="loginDemo('teacher')">دخول كمعلم · أ. سالم الحارثي</button>
      <button class="btn btn-gold" onclick="loginDemo('parent')">دخول كولي أمر</button>
    </div>
    <div class="note">لاحقاً يُربط الدخول بالبوابة التعليمية أو حساب المدرسة.</div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
