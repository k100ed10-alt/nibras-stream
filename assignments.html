<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>واجب تفاعلي | نبراس ستريم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">
  <div class="oman-strip"></div>
  <header class="nav app-nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html"><span class="logo-mark">ن</span> واجب الأسبوع</a>
      <a class="btn btn-ghost btn-sm" href="student.html">لوحة الطالب</a>
    </div>
  </header>
  <main class="container" style="padding:32px 0 60px">
    <div class="quiz">
      <h1>تدريب تفاعلي: المعادلات الخطية</h1>
      <div class="q-card"><strong>1) 2س + 5 = 17</strong><div class="options"><div class="opt" onclick="pickOption(this)">س = 5</div><div class="opt" onclick="pickOption(this)">س = 6</div><div class="opt" onclick="pickOption(this)">س = 12</div></div></div>
      <div class="q-card"><strong>2) 3س − 4 = 11</strong><div class="options"><div class="opt" onclick="pickOption(this)">3</div><div class="opt" onclick="pickOption(this)">5</div><div class="opt" onclick="pickOption(this)">7</div></div></div>
      <button class="btn btn-primary" onclick="submitQuiz()">تسليم الواجب</button>
      <div id="result" class="panel" style="display:none;margin-top:16px"><h3>تم التسليم</h3><p>الدرجة المبدئية 85%.</p></div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
