<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المعلم | حَصاد التعليمية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">
  <div class="oman-strip"></div>
  <header class="nav app-nav">
    <div class="container-wide nav-inner">
      <a class="brand" href="index.html"><span class="logo-mark">ح</span> حَصاد التعليمية</a>
      <a class="btn btn-gold btn-sm" href="studio.html">دخول الاستوديو</a>
    </div>
  </header>
  <div class="app-layout">

      <a class="side-item active" href="teacher.html">لوحة التحكم</a>
      <a class="side-item" href="studio.html">استوديو حَصاد</a>
    </aside>
    <main class="main">
      <h1>جدولة الأسبوع</h1>
      <div class="panel">
        <div class="form-grid">
          <div><label>عنوان الحصة</label><input id="lesson-title" type="text" value="حصة هذا الأسبوع" /></div>

          <button class="btn btn-primary" type="button" onclick="scheduleLesson()">حفظ</button>
          <input id="task-title" type="text" value="واجب الأسبوع" />
          <button class="btn btn-teal" type="button" onclick="createAssignment()">نشر واجب</button>
        </div>
        <div id="lesson-list"></div>
      </div>
    </main>
  </div>
