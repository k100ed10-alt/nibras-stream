<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استوديو البث | حَصاد التعليمية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="studio-page">
  <div class="oman-strip"></div>
  <div class="studio-bar">
    <a class="brand" href="index.html" style="color:#fff"><span class="logo-mark">ح</span> استوديو حَصاد</a>
    <span class="live-now" style="color:#fca5a5;font-weight:700">جاهز للبث</span>
    <span id="clock">--:--</span>
  </div>
  <div class="studio-grid">
    <div class="stage-wrap">
      <div class="big-stage">
        <div class="tile hero"><div class="overlay-bar">حَصاد · رياضيات 8</div><div class="avatar">👨‍🏫</div><div class="brand-bar">أ. سالم الحارثي — المعادلات الخطية</div></div>
        <div class="tile"><div class="avatar" style="font-size:42px">📊</div></div>
        <div class="tile"><div class="avatar" style="font-size:42px">👩‍🎓</div></div>
      </div>
    </div>
    <aside class="studio-side">
      <div class="tabs"><div class="tab active" onclick="switchTab('chat', this)">الشات</div></div>
      <div data-pane="chat" class="chat" style="display:flex;flex-direction:column"><div class="msg"><b>يوسف:</b> مرحبا في حَصاد</div></div>
    </aside>
  </div>
  <div class="dock"><button class="dock-btn go" onclick="goLive()"><span>🔴</span>بدء البث</button></div>
  <script src="js/app.js"></script>
</body>
</html>
